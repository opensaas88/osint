[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domainexposure"
version = "1.0.0"
description = "Evaluation passive de l'exposition cyber d'une organisation a partir d'un nom de domaine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "dnspython>=2.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "jinja2>=3.1",
    "idna>=3.10",
    "weasyprint>=62",
    "dnstwist>=20240116",
    "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008   : FastAPI utilise des appels (Query, Depends) comme valeurs par défaut.
# ASYNC109 : le paramètre `timeout` est transmis tel quel à httpx et à ssl,
#            qui gèrent eux-mêmes le délai ; un asyncio.timeout serait redondant.
ignore = ["B008", "ASYNC109"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
